name: 'github_pulse'
version: '1.0.0'
config-version: 2

profile: 'github_pulse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]


clean-targets: ["target", "dbt_packages"]



models:
  github_pulse:
    staging: 
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      core:
        +materialized: table
        +schema: core
      reporting:
        +materialized: table
        +schema: reporting


seeds:
  github_pulse:
    +schema: seeds

vars:
  dev_start_date: '2024-12-01'
  automation_actor_daily_events: 1000
  automation_repo_monthly_events: 10000
  automation_repo_top_type_share: 0.95
  automation_repo_bot_share: 0.9