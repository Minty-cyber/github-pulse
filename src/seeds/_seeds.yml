version: 2

seeds: 
  - name: event_types
    description: Reference list of GitHub event types with readable labels and categories
    config:   
      column_types: 
        event_type: string 
        event_label: string 
        event_category: string
        is_contribution: bool
        recorded_from: date
        description: string
    columns:
      - name: event_type
        description: GitHub event type name, as it appears in the source data
        data_tests: [unique, not_null]
      - name: event_category
        data_tests:
         - accepted_values:
            arguments:
              values: [code, collaboration, repo_management, community]
      - name: is_contribution
        data_tests: [not_null]
      - name: recorded_from
        description: First date this event type appears in the data
  - name: known_bots
    description: Bot accounts whose login does not end in [bot]. Logins are lowercase
    config:  
      column_types:
        actor_login: string
        reason: string

    columns:
      - name: actor_login
        data_tests: [unique, not_null]
  - name: data_quality_dates
    description: Days where the source data is missing or incomplete, grouped into incidents. Feeds dim_date.is_incomplete_data.
    config:
      column_types:
        date: date
        issue_type: string
        incident: string
        note: string
    columns:
      - name: date
        data_tests: [unique, not_null]
      - name: issue_type
        data_tests:
          - accepted_values:
              arguments:
                values: [missing, partial]
